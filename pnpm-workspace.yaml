packages:
  - packages/*

catalog:
  eslint: ^9.39.4
  prettier: ^3.9.10
  typescript: ^6.0.3

autoDedupe: true
dedupePeers: true

minimumReleaseAge: 2880 # 48 hours
minimumReleaseAgeExclude:
  - '@ktam/*'
  # Renovate security update: pnpm@11.11.0
  - pnpm@11.11.0

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 1 week

publicHoistPattern:
  - '@typescript-eslint/parser'
  - 'eslint-plugin-jsx-a11y'

publishBranch: main

savePrefix: ''
saveWorkspaceProtocol: rolling

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
